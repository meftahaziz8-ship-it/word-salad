
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
#ws-root { max-width: 460px; margin: 0 auto; padding: 0.75rem 0.5rem 1.5rem; user-select: none; }

/* ===== HOME SCREEN ===== */
#home-screen { display: none; text-align: center; padding: 1rem 0; }
#home-screen.visible { display: block; }
#home-title { font-size: 32px; font-weight: 500; color: var(--color-text-primary); letter-spacing: 0.04em; margin-bottom: 8px; }
#home-subtitle { font-size: 13px; color: var(--color-text-secondary); margin-bottom: 2rem; }
#levels-grid { display: flex; flex-direction: column; gap: 14px; align-items: center; }
.level-card { width: 100%; max-width: 360px; padding: 20px 24px; border-radius: 16px; border: 0.5px solid var(--color-border-tertiary); background: var(--color-background-primary); cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 18px; text-align: left; }
.level-card:hover:not(.locked) { background: var(--color-background-secondary); border-color: var(--color-border-secondary); transform: translateY(-2px); }
.level-card.locked { cursor: not-allowed; opacity: 0.55; }
.level-card.completed { background: #EAF3DE; border-color: #97C459; }
.level-card.completed:hover { background: #DDEACB; }
.level-num { width: 56px; height: 56px; border-radius: 50%; background: var(--color-background-secondary); display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 500; color: var(--color-text-primary); flex-shrink: 0; }
.level-card.completed .level-num { background: #97C459; color: #173404; }
.level-card.locked .level-num { background: var(--color-background-secondary); color: var(--color-text-tertiary); }

.level-theme { font-size: 13px; color: var(--color-text-secondary); margin-top: 2px; }

.level-card.locked .level-icon { color: var(--color-text-tertiary); }
#reset-btn { margin-top: 1.5rem; font-size: 11px; padding: 5px 14px; border-radius: 8px; border: 0.5px solid var(--color-border-tertiary); background: transparent; color: var(--color-text-tertiary); cursor: pointer; }
#reset-btn:hover { background: var(--color-background-secondary); }

/* ===== GAME SCREEN ===== */
#game-screen { display: none; }
#game-screen.visible { display: block; }
#back-btn { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 5px 12px; border-radius: 8px; border: 0.5px solid var(--color-border-tertiary); background: transparent; color: var(--color-text-secondary); cursor: pointer; margin-bottom: 8px; }
#back-btn:hover { background: var(--color-background-secondary); }
#ws-header { text-align: center; margin-bottom: 0.8rem; }
#ws-title { font-size: 22px; font-weight: 500; color: var(--color-text-primary); letter-spacing: 0.04em; }
#ws-theme-label { font-size: 11px; color: var(--color-text-secondary); margin-top: 3px; text-transform: uppercase; letter-spacing: 0.08em; }
#ws-theme-name { font-size: 16px; font-weight: 500; color: var(--color-text-primary); margin-top: 2px; }

.ws-word-chip { padding: 3px 12px; border-radius: 999px; font-size: 12px; font-weight: 500; border: 0.5px solid var(--color-border-tertiary); background: var(--color-background-secondary); color: var(--color-text-secondary); min-width: 60px; text-align: center; letter-spacing: 0.04em; transition: all 0.3s; }
.ws-word-chip.found { background: #EAF3DE; color: #3B6D11; border-color: #97C459; }
#ws-grid-wrap { text-align: center; position: relative; display: flex; justify-content: center; }

#ws-grid { display: inline-grid; gap: 7px; touch-action: none; position: relative; z-index: 2; }
#ws-line-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }
.ws-cell { width: 72px; height: 72px; border-radius: 12px; border: 0.5px solid var(--color-border-tertiary); background: var(--color-background-primary); display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 500; color: var(--color-text-primary); cursor: pointer; transition: background 0.15s, color 0.15s, transform 0.1s, opacity 0.3s, border-color 0.3s; position: relative; }
.ws-cell.empty { background: transparent; border: none; pointer-events: none; }
.ws-cell.selected { background: #E6F1FB; color: #0C447C; border-color: #378ADD; transform: scale(1.08); }
.ws-cell.found-flash { background: #EAF3DE; color: #3B6D11; border-color: #97C459; }
.ws-cell.error-flash { background: #FCEBEB; color: #A32D2D; border-color: #F09595; }
.ws-cell.removed { opacity: 0; transform: scale(0.3); pointer-events: none; }
.ws-cell.hint-revealed { background: #FAEEDA; color: #633806; border-color: #FAC775; }
.ws-cell.hint-revealed::after { content: ''; position: absolute; top: 4px; right: 4px; width: 8px; height: 8px; background: #BA7517; border-radius: 50%; }
#ws-current-word { text-align: center; min-height: 32px; font-size: 20px; font-weight: 500; letter-spacing: 0.12em; color: var(--color-text-primary); margin: 0.9rem 0 0.3rem; }
#ws-current-word.error { color: #A32D2D; }
#ws-current-word.success { color: #3B6D11; }
#ws-msg { text-align: center; min-height: 18px; font-size: 12px; color: var(--color-text-secondary); margin-bottom: 0.5rem; }
#ws-controls { display: flex; gap: 10px; justify-content: center; align-items: center; margin-top: 0.5rem; }
#ws-controls button { font-size: 13px; padding: 6px 16px; border-radius: 8px; border: 0.5px solid var(--color-border-secondary); background: var(--color-background-primary); color: var(--color-text-primary); cursor: pointer; display: flex; align-items: center; gap: 6px; }
#ws-controls button:hover:not(:disabled) { background: var(--color-background-secondary); }
#ws-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
.hint-dots { display: inline-flex; gap: 3px; margin-left: 4px; }
.hint-dot { width: 7px; height: 7px; border-radius: 50%; background: #BA7517; }
.hint-dot.used { background: var(--color-border-tertiary); }
#ws-win-screen { display: none; text-align: center; padding: 1.5rem 1rem; }
#ws-win-screen.visible { display: block; }
#ws-win-title { font-size: 24px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 6px; }
#ws-win-sub { font-size: 14px; color: var(--color-text-secondary); margin-bottom: 1rem; }
#ws-win-time { font-size: 36px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 1rem; font-variant-numeric: tabular-nums; letter-spacing: 0.05em; }
#ws-win-unlock { font-size: 13px; color: #3B6D11; background: #EAF3DE; padding: 8px 16px; border-radius: 8px; display: inline-block; margin-bottom: 1.2rem; }
#ws-win-actions { display: flex; gap: 10px; justify-content: center; }
#ws-win-actions button { padding: 8px 20px; border-radius: 8px; border: 0.5px solid var(--color-border-secondary); background: var(--color-background-primary); color: var(--color-text-primary); cursor: pointer; font-size: 14px; }
#ws-win-actions button:hover { background: var(--color-background-secondary); }
#ws-win-actions button.primary { background: #1D9E75; color: white; border-color: #1D9E75; }
#ws-win-actions button.primary:hover { background: #0F6E56; }
</style>

<h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Word Salad — système de niveaux.</h2>

<div id="ws-root">
  <!-- HOME SCREEN -->
  <div id="home-screen" class="visible">
    <div id="home-title">Word Salad</div>
    <div id="home-subtitle">Choisis ton niveau pour commencer</div>
    <div id="levels-grid"></div>
    <button id="reset-btn"><i class="ti ti-refresh" aria-hidden="true"></i> Réinitialiser ma progression</button>
  </div>

  <!-- GAME SCREEN -->
  <div id="game-screen">
    <button id="back-btn"><i class="ti ti-arrow-left" aria-hidden="true"></i> Retour</button>
    <div id="ws-header">
      <div id="ws-title">Word Salad</div>
      <div id="ws-theme-label">Niveau <span id="ws-level-num">1</span></div>
      <div id="ws-theme-name">—</div>
      <div id="ws-timer">00:00</div>
    </div>
    <div id="ws-words-list"></div>
    <div id="ws-grid-wrap">
      <div id="ws-grid-stage">
        <div id="ws-grid"></div>
        <svg id="ws-line-overlay"></svg>
      </div>
    </div>
    <div id="ws-current-word"></div>
    <div id="ws-msg"></div>
    <div id="ws-controls">
      <button id="btn-hint">
        <i class="ti ti-bulb" aria-hidden="true"></i> Indice
        <span class="hint-dots" id="hint-dots">
          <span class="hint-dot"></span>
          <span class="hint-dot"></span>
          <span class="hint-dot"></span>
        </span>
      </button>
      <button id="btn-clear"><i class="ti ti-x" aria-hidden="true"></i> Effacer</button>
    </div>
    <div id="ws-win-screen">
      <div id="ws-win-title">Bravo !</div>
      <div id="ws-win-sub">Tu as terminé en</div>
      <div id="ws-win-time">00:00</div>
      <div id="ws-win-unlock"></div>
      <div id="ws-win-actions">
        <button id="ws-home-btn"><i class="ti ti-home" aria-hidden="true"></i> Accueil</button>
        <button id="ws-next-btn" class="primary">Niveau suivant <i class="ti ti-arrow-right" aria-hidden="true"></i></button>
      </div>
    </div>

<script>
const LEVELS = [
  { id: 1, name: "Niveau 1", theme: "Couleurs", words: ["ROUGE","BLEU","VERT","ROSE","JAUNE"], icon: "palette" },
  { id: 2, name: "Niveau 2", theme: "Fruits", words: ["POMME","POIRE","BANANE","FRAISE","KIWI"], icon: "apple" },
  { id: 3, name: "Niveau 3", theme: "Instruments de musique", words: ["PIANO","HARPE","VIOLON","FLUTE","BATTERIE"], icon: "music" },
];

let progress = { unlocked: 1, completed: {} }; // {levelId: timeInSeconds}

// ===== PROGRESS STORAGE =====
async function loadProgress() {
  try {
    const result = await window.storage.get('ws-progress');
    if (result && result.value) {
      progress = JSON.parse(result.value);
    }
  } catch (e) {
    // First time or error — keep defaults
    progress = { unlocked: 1, completed: {} };
  }
}

async function saveProgress() {
  try {
    await window.storage.set('ws-progress', JSON.stringify(progress));
  } catch (e) {
    console.error('Save failed', e);
  }
}

async function resetProgress() {
  progress = { unlocked: 1, completed: {} };
  try { await window.storage.delete('ws-progress'); } catch (e) {}
  renderHome();
}

function formatTime(s) {
  const m = Math.floor(s/60), sec = s % 60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

// ===== HOME SCREEN =====
function renderHome() {
  const grid = document.getElementById('levels-grid');
  grid.innerHTML = '';
  LEVELS.forEach(lvl => {
    const card = document.createElement('div');
    const isCompleted = progress.completed[lvl.id] !== undefined;
    const isUnlocked = lvl.id <= progress.unlocked;
    card.className = 'level-card' + (isCompleted ? ' completed' : '') + (!isUnlocked ? ' locked' : '');

    const numContent = isCompleted
      ? '<i class="ti ti-check" aria-hidden="true"></i>'
      : isUnlocked ? lvl.id : '<i class="ti ti-lock" aria-hidden="true"></i>';

    const status = isCompleted
      ? `Terminé en ${formatTime(progress.completed[lvl.id])}`
      : isUnlocked ? 'Disponible' : `Termine le niveau ${lvl.id - 1} pour débloquer`;

    card.innerHTML = `
      <div class="level-num">${numContent}</div>
      <div class="level-info">
        <div class="level-name">${lvl.name}</div>
        <div class="level-theme">${lvl.theme}</div>
        <div class="level-status">${status}</div>
      </div>
      <i class="ti ti-${isUnlocked ? 'chevron-right' : 'lock'} level-icon" aria-hidden="true"></i>
    `;

    if (isUnlocked) {
      card.addEventListener('click', () => startLevel(lvl.id));
    }
    grid.appendChild(card);
  });
}

function showHome() {
  stopTimer();
  document.getElementById('home-screen').classList.add('visible');
  document.getElementById('game-screen').classList.remove('visible');
  renderHome();
}

function startLevel(id) {
  currentLevelId = id;
  document.getElementById('home-screen').classList.remove('visible');
  document.getElementById('game-screen').classList.add('visible');
  document.getElementById('ws-win-screen').classList.remove('visible');
  initGame();
}

// ===== GAME LOGIC =====
let currentLevelId = 1;
let puzzle, gridLetters, gridRows, gridCols;
let usedCells, wordPaths = [];
let selectedCells = [], foundWords = [];
let isDragging = false;
let timerStart = null, timerInterval = null, timerSeconds = 0;
let hintsLeft = 3;
let revealedFirstLetters = new Set();

function isAdjacent(r1, c1, r2, c2) {
  return Math.abs(r1-r2) <= 1 && Math.abs(c1-c2) <= 1 && !(r1===r2 && c1===c2);
}
function shuffle(arr) {
  for (let i=arr.length-1;i>0;i--) {
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
}

function buildOneGrid(words, rows, cols) {
  const grid = Array.from({length:rows}, () => Array(cols).fill(''));
  const placed = [];
  function tryPlaceWord(word) {
    const allCells = [];
    for (let r=0;r<rows;r++) for (let c=0;c<cols;c++) allCells.push([r,c]);
    shuffle(allCells);
    allCells.sort((a,b) => {
      const aMatch = grid[a[0]][a[1]] === word[0] ? -1 : 0;
      const bMatch = grid[b[0]][b[1]] === word[0] ? -1 : 0;
      return aMatch - bMatch;
    });
    for (const [sr, sc] of allCells) {
      if (grid[sr][sc] !== '' && grid[sr][sc] !== word[0]) continue;
      const path = [[sr, sc]];
      const usedKeys = new Set([sr+','+sc]);
      function dfs(letterIdx) {
        if (letterIdx === word.length) return true;
        const [pr, pc] = path[path.length - 1];
        const nbrs = [];
        for (let dr=-1;dr<=1;dr++) for (let dc=-1;dc<=1;dc++) {
          if (dr===0&&dc===0) continue;
          const nr=pr+dr, nc=pc+dc;
          if (nr<0||nr>=rows||nc<0||nc>=cols) continue;
          if (usedKeys.has(nr+','+nc)) continue;
          if (grid[nr][nc]!=='' && grid[nr][nc]!==word[letterIdx]) continue;
          nbrs.push([nr,nc]);
        }
        nbrs.sort((a,b) => {
          const aHas = grid[a[0]][a[1]] === word[letterIdx] ? -1 : 0;
          const bHas = grid[b[0]][b[1]] === word[letterIdx] ? -1 : 0;
          return aHas - bHas + (Math.random()-0.5)*0.3;
        });
        for (const [nr, nc] of nbrs) {
          path.push([nr, nc]);
          usedKeys.add(nr+','+nc);
          if (dfs(letterIdx + 1)) return true;
          path.pop();
          usedKeys.delete(nr+','+nc);
        }
        return false;
      }
      if (dfs(1)) {
        path.forEach(([r,c],i) => grid[r][c] = word[i]);
        placed.push({word, cells: [...path]});
        return true;
      }
    }
    return false;
  }
  const sorted = [...words].sort((a,b) => b.length-a.length);
  for (const w of sorted) if (!tryPlaceWord(w)) return null;
  const used = Array.from({length:rows}, () => Array(cols).fill(false));
  for (const p of placed) for (const [r,c] of p.cells) used[r][c] = true;
  for (const p of placed) {
    for (let i=1;i<p.cells.length;i++) {
      const [r1,c1] = p.cells[i-1];
      const [r2,c2] = p.cells[i];
      if (!isAdjacent(r1,c1,r2,c2)) return null;
      if (grid[r2][c2] !== p.word[i]) return null;
    }
  }
  let usedCount = 0;
  for (let r=0;r<rows;r++) for (let c=0;c<cols;c++) if (used[r][c]) usedCount++;
  return {grid, placed, used, usedCount};
}

function buildGrid(words) {
  let best = null, bestUsed = Infinity;
  for (let size = 4; size <= 7; size++) {
    for (let attempt = 0; attempt < 100; attempt++) {
      const result = buildOneGrid(words, size, size);
      if (result && result.usedCount < bestUsed) {
        best = result; bestUsed = result.usedCount;
      }
    }
    if (best) break;
  }
  return best;
}

function startTimer() {
  timerStart = Date.now(); timerSeconds = 0;
  document.getElementById('ws-timer').textContent = '00:00';
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timerSeconds = Math.floor((Date.now() - timerStart) / 1000);
    document.getElementById('ws-timer').textContent = formatTime(timerSeconds);
  }, 250);
}
function stopTimer() { if (timerInterval) { clearInterval(timerInterval); timerInterval = null; } }

function updateHintDots() {
  const dots = document.querySelectorAll('#hint-dots .hint-dot');
  dots.forEach((d, i) => {
    if (i < 3 - hintsLeft) d.classList.add('used');
    else d.classList.remove('used');
  });
  document.getElementById('btn-hint').disabled = hintsLeft <= 0;
}

function initGame() {
  const level = LEVELS.find(l => l.id === currentLevelId);
  puzzle = { theme: level.theme, words: [...level.words] };
  foundWords=[]; selectedCells=[]; isDragging=false;
  hintsLeft = 3; revealedFirstLetters = new Set();
  const built = buildGrid(puzzle.words);
  if (!built) return;
  gridLetters = built.grid; wordPaths = built.placed; usedCells = built.used;
  gridRows = gridLetters.length; gridCols = gridLetters[0].length;
  document.getElementById('ws-level-num').textContent = currentLevelId;
  document.getElementById('ws-theme-name').textContent = puzzle.theme;
  document.getElementById('ws-win-screen').classList.remove('visible');
  renderWords(); renderGrid(); updateHintDots();
  document.getElementById('ws-current-word').textContent = '';
  document.getElementById('ws-current-word').className = '';
  document.getElementById('ws-msg').textContent = 'Glisse pour former un mot';
  clearLine();
  startTimer();
}

function renderWords() {
  const el = document.getElementById('ws-words-list');
  el.innerHTML = '';
  const foundSorted = [...foundWords].sort();
  const unfound = puzzle.words.filter(w => !foundWords.includes(w));
  foundSorted.forEach(w => {
    const chip = document.createElement('div');
    chip.className = 'ws-word-chip found';
    chip.textContent = w;
    el.appendChild(chip);
  });
  unfound.forEach(w => {
    const chip = document.createElement('div');
    chip.className = 'ws-word-chip';
    chip.textContent = '· '.repeat(w.length).trim();
    el.appendChild(chip);
  });
}

function renderGrid() {
  const grid = document.getElementById('ws-grid');
  grid.style.gridTemplateColumns = `repeat(${gridCols}, 72px)`;
  grid.innerHTML = '';
  for (let r=0;r<gridRows;r++) for (let c=0;c<gridCols;c++) {
    const cell = document.createElement('div');
    if (!usedCells[r][c]) {
      cell.className = 'ws-cell empty';
    } else {
      cell.className = 'ws-cell';
      if (revealedFirstLetters.has(r+','+c)) cell.classList.add('hint-revealed');
      cell.dataset.r = r; cell.dataset.c = c;
      cell.textContent = gridLetters[r][c];
    }
    grid.appendChild(cell);
  }
  setTimeout(() => {
    const svg = document.getElementById('ws-line-overlay');
    svg.setAttribute('width', grid.offsetWidth);
    svg.setAttribute('height', grid.offsetHeight);
    svg.setAttribute('viewBox', `0 0 ${grid.offsetWidth} ${grid.offsetHeight}`);
  }, 0);
  setupEvents();
}

function getCellEl(r, c) { return document.querySelector(`.ws-cell[data-r="${r}"][data-c="${c}"]`); }
function getCellCenter(r, c) {
  const el = getCellEl(r, c);
  const grid = document.getElementById('ws-grid');
  if (!el || !grid) return null;
  const elRect = el.getBoundingClientRect();
  const gridRect = grid.getBoundingClientRect();
  return { x: elRect.left - gridRect.left + elRect.width/2, y: elRect.top - gridRect.top + elRect.height/2 };
}

function drawLine() {
  const svg = document.getElementById('ws-line-overlay');
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  if (selectedCells.length < 1) return;
  const pts = selectedCells.map(s => getCellCenter(s.r, s.c)).filter(Boolean);
  if (pts.length === 0) return;
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.setAttribute('opacity', '0.35');
  if (pts.length > 1) {
    const path = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p.x + ',' + p.y).join(' ');
    const lineEl = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    lineEl.setAttribute('d', path);
    lineEl.setAttribute('stroke', '#378ADD');
    lineEl.setAttribute('stroke-width', '14');
    lineEl.setAttribute('stroke-linecap', 'round');
    lineEl.setAttribute('stroke-linejoin', 'round');
    lineEl.setAttribute('fill', 'none');
    g.appendChild(lineEl);
  } else {
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('cx', pts[0].x); c.setAttribute('cy', pts[0].y);
    c.setAttribute('r', '14'); c.setAttribute('fill', '#378ADD');
    g.appendChild(c);
  }
  svg.appendChild(g);
}

function clearLine() {
  const svg = document.getElementById('ws-line-overlay');
  if (svg) while (svg.firstChild) svg.removeChild(svg.firstChild);
}

function clearAllTransientClasses() {
  document.querySelectorAll('.ws-cell').forEach(c => {
    c.classList.remove('selected', 'error-flash', 'found-flash');
  });
}

function getCell(e) {
  const t = e.touches ? e.touches[0] : e;
  const el = document.elementFromPoint(t.clientX, t.clientY);
  if (el && el.classList.contains('ws-cell') && !el.classList.contains('empty') && !el.classList.contains('removed')) return el;
  return null;
}

function setupEvents() {
  const grid = document.getElementById('ws-grid');
  grid.onmousedown = e => { e.preventDefault(); startSel(getCell(e)); };
  grid.onmousemove = e => { if (!isDragging) return; e.preventDefault(); moveSel(getCell(e)); };
  document.onmouseup = () => { if (isDragging) { isDragging=false; submitWord(); } };
  grid.ontouchstart = e => { e.preventDefault(); startSel(getCell(e)); };
  grid.ontouchmove = e => { if (!isDragging) return; e.preventDefault(); moveSel(getCell(e)); };
  grid.ontouchend = () => { if (isDragging) { isDragging=false; submitWord(); } };
}

function startSel(cell) {
  isDragging = true; selectedCells = [];
  clearAllTransientClasses(); clearLine();
  if (cell) addToSel(cell);
}

function addToSel(cell) {
  if (!cell) return;
  const r = parseInt(cell.dataset.r), c = parseInt(cell.dataset.c);
  const key = r+','+c;
  const existIdx = selectedCells.findIndex(s => s.key === key);
  if (existIdx !== -1) {
    if (existIdx === selectedCells.length - 2) {
      const last = selectedCells.pop();
      last.el.classList.remove('selected');
      updateCurrentWord();
      drawLine();
    }
    return;
  }
  if (selectedCells.length > 0) {
    const prev = selectedCells[selectedCells.length-1];
    if (!isAdjacent(r, c, prev.r, prev.c)) return;
  }
  selectedCells.push({r, c, key, el: cell});
  cell.classList.add('selected');
  updateCurrentWord();
  drawLine();
}
function moveSel(cell) { addToSel(cell); }

function updateCurrentWord() {
  const word = selectedCells.map(s => gridLetters[s.r][s.c]).join('');
  const el = document.getElementById('ws-current-word');
  el.textContent = word;
  el.className = '';
}

function isCellSharedByUnfound(r, c) {
  return wordPaths.some(p =>
    !foundWords.includes(p.word) && p.cells.some(([pr,pc]) => pr===r && pc===c)
  );
}

function submitWord() {
  const word = selectedCells.map(s => gridLetters[s.r][s.c]).join('');
  const cellsSnapshot = [...selectedCells];
  if (puzzle.words.includes(word) && !foundWords.includes(word)) {
    foundWords.push(word);
    cellsSnapshot.forEach(s => { s.el.classList.remove('selected'); s.el.classList.add('found-flash'); });
    document.getElementById('ws-current-word').className = 'success';
    document.getElementById('ws-msg').textContent = '✓ "' + word + '" trouvé !';
    selectedCells = [];
    clearLine();
    setTimeout(() => {
      cellsSnapshot.forEach(s => {
        s.el.classList.remove('found-flash');
        if (!isCellSharedByUnfound(s.r, s.c)) s.el.classList.add('removed');
      });
      document.getElementById('ws-current-word').textContent = '';
      document.getElementById('ws-current-word').className = '';
      renderWords();
      if (foundWords.length === puzzle.words.length) showWin();
    }, 550);
  } else {
    if (word.length > 1) {
      cellsSnapshot.forEach(s => { s.el.classList.remove('selected'); s.el.classList.add('error-flash'); });
      document.getElementById('ws-current-word').className = 'error';
      document.getElementById('ws-msg').textContent = '"' + word + '" n\'est pas dans le thème.';
    } else {
      cellsSnapshot.forEach(s => s.el.classList.remove('selected'));
    }
    selectedCells = [];
    clearLine();
    setTimeout(() => {
      document.querySelectorAll('.ws-cell.error-flash').forEach(c => c.classList.remove('error-flash'));
      document.getElementById('ws-current-word').textContent = '';
      document.getElementById('ws-current-word').className = '';
    }, 400);
  }
}

async function showWin() {
  stopTimer();
  // Save best time
  const prevTime = progress.completed[currentLevelId];
  if (prevTime === undefined || timerSeconds < prevTime) {
    progress.completed[currentLevelId] = timerSeconds;
  }
  // Unlock next level
  const nextLevel = currentLevelId + 1;
  let unlockMessage = '';
  if (nextLevel <= LEVELS.length && nextLevel > progress.unlocked) {
    progress.unlocked = nextLevel;
    unlockMessage = `🔓 Niveau ${nextLevel} débloqué !`;
  } else if (currentLevelId === LEVELS.length) {
    unlockMessage = '🏆 Tu as terminé tous les niveaux !';
  }
  await saveProgress();

  document.getElementById('ws-win-time').textContent = formatTime(timerSeconds);
  const unlockEl = document.getElementById('ws-win-unlock');
  if (unlockMessage) {
    unlockEl.textContent = unlockMessage;
    unlockEl.style.display = 'inline-block';
  } else {
    unlockEl.style.display = 'none';
  }
  // Hide "next level" button if no next or not unlocked
  const nextBtn = document.getElementById('ws-next-btn');
  if (nextLevel > LEVELS.length) {
    nextBtn.style.display = 'none';
  } else {
    nextBtn.style.display = '';
  }
  document.getElementById('ws-win-screen').classList.add('visible');
}

function useHint() {
  if (hintsLeft <= 0) return;
  const remaining = wordPaths.filter(p => !foundWords.includes(p.word));
  const candidates = remaining.filter(p => {
    const [r,c] = p.cells[0];
    return !revealedFirstLetters.has(r+','+c);
  });
  if (!candidates.length) {
    document.getElementById('ws-msg').textContent = 'Toutes les premières lettres sont déjà révélées !';
    return;
  }
  const target = candidates[Math.floor(Math.random()*candidates.length)];
  const [r, c] = target.cells[0];
  revealedFirstLetters.add(r+','+c);
  const el = getCellEl(r, c);
  if (el) el.classList.add('hint-revealed');
  hintsLeft--;
  updateHintDots();
  document.getElementById('ws-msg').textContent = `Indice : la première lettre du mot "${'·'.repeat(target.word.length)}" est révélée`;
}

// ===== EVENT WIRING =====
document.getElementById('btn-hint').addEventListener('click', useHint);
document.getElementById('btn-clear').addEventListener('click', () => {
  clearAllTransientClasses(); selectedCells = []; clearLine();
  document.getElementById('ws-current-word').textContent = '';
  document.getElementById('ws-msg').textContent = '';
});
document.getElementById('back-btn').addEventListener('click', showHome);
document.getElementById('ws-home-btn').addEventListener('click', showHome);
document.getElementById('ws-next-btn').addEventListener('click', () => {
  const next = currentLevelId + 1;
  if (next <= LEVELS.length) startLevel(next);
});
document.getElementById('reset-btn').addEventListener('click', () => {
  if (confirm('Tu veux vraiment réinitialiser ta progression ?')) {
    resetProgress();
  }
});
window.addEventListener('resize', () => { if (selectedCells.length) drawLine(); });

// ===== INIT =====
(async function() {
  await loadProgress();
  renderHome();
})();
</script>
